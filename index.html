var GATE_P=[S_("Mossback","Mmm. Good morning. Or afternoon. Which is it? I lose track."),S_("Wren","Morning, Mossback. Have you seen my grandmother?"),S_("Mossback","Hester? Through the gate at dawn. Said she'd be back for breakfast. That was yesterday's breakfast, I think."),S_("Mossback","Gate's closed, though. The sign says so. I never argue with signs. Signs are very smart.")];

/* ================= TEXT: CH9 ================= */
CH9.intro=[N("Bramblewood ended the way a bad joke ends: suddenly, and with a smell."),N("Burnt sugar. Warm, sticky, slightly alarming. Ahead, the road was the colour of toffee, and the trees had gumdrops where their leaves should be."),S_("Pocket","The Sweet Road. Everything here is edible, and nothing here is free."),S_("Wren","I'm not hungry."),S_("Pocket","Nobody is hungry. That's how it gets you.")];
var LICK_P=[N("A striped post held a sign: WELCOME TO THE SWEET ROAD. PLEASE DO NOT LICK."),S_("Pocket","Don't look at me. I'm an inkpot. I have no tongue."),S_("Wren","You were thinking about it."),S_("Pocket","I was thinking about it professionally.")];
var LICK_R={LUCK:[N("The sign wobbles. A coin rolls out of the post and into Wren's hand. It is chocolate, and it is also lucky.")],LICE:[N("Every bird on the road begins to scratch. A small, polite itch spreads across the countryside.")],LIKE:[N("PLEASE DO NOT LIKE. A passing bird sighs, clutches its heart, and flies off to be dramatic somewhere else.")]};
var HANSEL_A=[N("Up ahead, a young man in a flour-white apron was running in a circle, scattering crumbs from a bag as he went. Behind him, forty birds followed in a very organised line."),S_("Hansel","Don't mind me! Don't mind them! I'm leaving a trail. I always leave a trail. So I can find my way back."),S_("Wren","Back where?"),S_("Hansel","...I'm not sure. That's the trouble with the trail. I've eaten the destination."),S_("Pocket","The birds have eaten the trail, not you."),S_("Hansel","Have they? Oh, they have. I'm Hansel. I'm terribly lost. Pleased to meet you!")];
var HANSEL_B=[S_("Hansel","Are you looking for the market? My sister runs it. Gretel. She's very good at things."),S_("Wren","Did a woman in a green shawl come through here? Sixty-eight. Walks like she's late."),S_("Hansel","Oh! The shawl! Yes! She bought a secret from Gretel and gave me a biscuit. A good biscuit."),N("Wren's heart did a little jump, like a cat landing on a shelf."),S_("Hansel","Gretel will tell you the rest. For a price. Everything's for a price here. Even the weather, on Thursdays.")];
var BIRD_R={HAPPY:[N("The nearest bird bursts into song. The others, offended, burst into different songs.")],HANDSOME:[N("The bird puffs its chest, checks its reflection in a spoon, and takes a long, satisfied walk.")],HELPFUL:[N("The bird picks up a crumb, carries it back to Hansel, and drops it in his hand. The other birds copy it. Hansel cries a little.")]};
var GROVE=[N("The gumdrop grove rang with tiny sticky sounds, like a thousand people opening a thousand jam jars."),S_("Pocket","Don't touch the trees."),S_("Wren","I wasn't."),S_("Pocket","Don't touch the trees with your eyes."),N("A green thread was caught on a gumdrop branch, glowing in the sugar like a thin green vein.")];
var STICKY_P=[N("The road was blocked by a gate made of toffee. It had been left out in the sun, and it was beginning to think about its choices."),S_("Hansel","It's STICKY. Always is. Gretel says I should oil it. I say it's a gate with character."),S_("Pocket","Wren. The word.")];
var STICKY_R={SLICK:[N("The toffee turns to glass. The gate slides open so smoothly that Hansel falls through it, with great dignity, face first.")],SPICY:[N("The gate blushes red and sneezes the hinge clean off. Hansel offers it a handkerchief.")],SLEEPY:[N("The gate yawns. Slowly, politely, it lies down on the road like a rug and goes back to sleep.")]};
var HAIL9=[N("Beyond the gate, the road widened and became a street. Lanterns shaped like boiled sweets hung from poles."),N("A voice cut across the whole street, brisk as a pair of scissors."),S_("Gretel","HANSEL. You've brought a customer. Or a stray. Which?"),S_("Hansel","Both, I think!")];
/* ================= TEXT: CH10 ================= */
CH10.intro=[N("The Secret Market was a street of striped stalls, each hung with glass jars. Every jar glowed faintly. Every jar was whispering."),S_("Pocket","Don't open any. A secret in a jar is like a bee in a hat.")];
var GRETEL_A=[N("A tall woman in a spotless apron stood behind the biggest stall, writing in a ledger. She did not look up."),S_("Gretel","Gretel. Prices are on the board. Refunds are not on the board, because there aren't any."),S_("Hansel","She's lovely once you know her."),S_("Gretel","I'm exactly as lovely as the prices allow.")];
var JARS=[N("The jars had labels. ‘What your neighbour really thinks of your hedge.’ ‘Where the left sock goes.’ ‘A very small, very specific lie about the moon.’"),S_("Wren","Who buys these?"),S_("Gretel","People who like to be sure. Or like to be sure other people aren't.")];
var SECRET_R={SECRETARY:[N("A tiny secretary with a tiny typewriter springs out of the jar. She asks, very politely, if anyone needs anything typed.")],SAUCEPAN:[N("The secret becomes a saucepan. It's warm, it's useful, and it's still whispering. Now it whispers recipes.")],SCRAMBLED:[N("The secret scrambles. Nobody knows anything now. It is, on the whole, a great relief.")]};
var GRETEL_B=[S_("Wren","A woman in a green shawl came here. Two days ago."),S_("Gretel","Hester. Yes. She bought a secret. Paid in full. Left a tip, which I don't allow."),S_("Wren","What did she pay with?"),S_("Gretel","That's confidential. It's literally the business."),S_("Wren","Then I'd like to buy one too. Where did she go?")];
var GRETEL_C=[S_("Gretel","Of course. Ten gumdrops, or one true thing."),S_("Wren","I only have honey toast."),S_("Gretel","That's a true thing. The taste of it, anyway. I'll take the taste."),S_("Pocket","WREN."),S_("Pocket","Your grandmother's note! 'Don't pay with anything you'll miss!'"),S_("Wren","It's toast. I'm not going to miss toast."),S_("Gretel","Everyone says that. Sign here.")];
var PRICE_R={PAID:[N("Gretel closes the ledger. A small, warm something leaves Wren, like a coat taken from her shoulders. It doesn't hurt. It's just gone.")],PENDING:[N("Gretel writes it down in pencil. A moment later the taste leaves anyway. Pending, it turns out, only means slow.")],PAUSED:[N("Gretel pauses the sale, politely, for a moment. Then Wren realises the toast has already gone. The pause was only manners.")]};
var AFTER10=[N("Wren took out Marrow's slice and bit into it. It was warm. It was crunchy. It was exactly the texture of toast."),N("It tasted of nothing at all."),S_("Pocket","Wren?"),S_("Wren","...It's fine. It's just a taste."),S_("Pocket","It's your grandmother's toast. It's her kitchen."),S_("Wren","I know. I know that. It still is. I just can't—"),N("She finished the slice anyway. It seemed rude not to.")];
var GRETEL_D=[S_("Gretel","Here's your secret. Grimsby's house. Two miles on. She keeps a bed-and-breakfast. Hester stayed the night."),S_("Gretel","And a free one, since I've never seen anyone eat that sadly. The one with the pencil was once somebody's brother."),S_("Wren","Whose?"),S_("Gretel","That's a different sale.")];
var HANSEL_LOST=[S_("Hansel","Hello again! Is this the market? I've been walking for an hour."),S_("Gretel","You've been standing next to the stall for an hour."),S_("Hansel","That explains why I never got anywhere!")];
var RECEIPT=[N("Gretel tore a small slip from the ledger and pressed it into Wren's hand. NO REFUNDS, it read. Underneath, in smaller letters: SORRY."),S_("Gretel","I mean it. About the sorry. Go on. Grimsby doesn't like being kept waiting. She doesn't like anything, but she doesn't like that most.")];
/* ================= TEXT: CH11 ================= */
CH11.intro=[N("Two miles on, the Sweet Road turned the colour of ginger. Roofs grew out of the verges. Lampposts became candy canes. Everything smelled of warm biscuits."),S_("Pocket","I've never been so frightened of a smell.")];
var GRIM_A=[N("At the end of a lane stood a gingerbread house with a white icing roof. A very tall woman in a pointed hat was chasing birds away from the chimney with a tea towel."),S_("Grimsby","Shoo! SHOO! That's load-bearing icing! It took me all spring!"),N("She saw Wren, froze, and whipped the hat behind her back.")];
var GRIM_B=[S_("Grimsby","I'm Grimsby. I'm not that kind of witch anymore. I haven't been in thirty-one years."),S_("Pocket","What kind?"),S_("Grimsby","The kind with ovens. I run a bed-and-breakfast now. Strictly vegetarian."),S_("Wren","That's nice."),S_("Grimsby","It's mostly eggs. People are very understanding.")];
var EDIBLE_P=[N("A sign by the gate read: THIS HOUSE IS EDIBLE. PLEASE DON'T."),S_("Grimsby","Hansel's idea. I'd have written something firmer.")];
var EDIBLE_R={INEDIBLE:[N("The house becomes stern and brown. A hungry squirrel gives up with a dignified little sniff.")],INCREDIBLE:[N("The house is suddenly magnificent. Spires appear. Several birds pay admission.")],INVISIBLE:[N("The house vanishes. The smell does not. Everyone stands in a ginger-scented field, bumping gently into walls.")]};
var DOOR_P=[S_("Grimsby","Come in, come in! If the door will let you. It's locked. It's been locked since Tuesday. I've forgotten what's on the other side."),S_("Pocket","Wren. The word. Every door is a sentence if you stand close enough.")];
var DOOR_R={LOVED:[N("The door gives Wren a long, warm hug and swings open. She is slightly squashed and entirely delighted.")],LICKED:[N("The door tastes of toffee. It clicks open, embarrassed. Wren decides never to speak of it.")],LOCKET:[N("The lock pops into a little silver locket and drops into Wren's palm. The door sighs open behind it.")]};
var GRIM_C=[S_("Grimsby","Tea. Biscuits. A cardigan, if you need one. Hester stayed in the blue room. She fixed my oven door, which no one's done since I was a girl."),S_("Grimsby","She left something for you. In case you came."),N("From a drawer she drew a silver locket on a green thread. Inside, two children grinned at the artist. One face had been rubbed gently away, as if by a thumb."),S_("Wren","Who are they?"),S_("Grimsby","She didn't say. She wept, a little. She doesn't weep.")];
var GRIM_D=[S_("Grimsby","The road north is going wrong. People walk in and walk out the same place. Three days now."),S_("Grimsby","Your grandmother called it a Loop. She said the Hush eats endings. So it starts with the roads."),S_("Pocket","She's right. Loops first. Then silence."),S_("Grimsby","I'd come with you, but the oven's on. It's always on. It's a habit.")];
var GRIM_OVEN=[S_("Grimsby","I haven't put anybody in an oven in thirty-one years. It's practically a personal best."),S_("Wren","That's... good."),S_("Grimsby","I think so. I put a note on the oven door. 'No.' It helps.")];
var HUSHEDGE=[N("On the horizon, the colours went pale. A frost of cyan crept across the biscuit fields, one frosting at a time."),S_("Pocket","The Hush."),N("Somewhere in the sugar, something wet and quiet went splorp."),S_("Grimsby","Smudges. In MY sugar? Oh, I'll have words. Run. Go on. I'll bar the door.")];
/* ================= TEXT: CH12 ================= */
CH12.intro=[N("They ran. The sugar-sand squeaked under their feet like new snow."),S_("Pocket","It's faster than last time!"),S_("Wren","Last time you said they were patient."),S_("Pocket","It's rushing! It's never rushed! Someone's giving it directions!")];
var CAR_R={CARAVAN:[N("The caramel pool becomes a caravan. The Smudge climbs in, politely, asks for directions, and gets lost.")],CAMEL:[N("The pool becomes a camel. It looks at the Smudge. It spits. It has had a long week.")],CARNIVAL:[N("The pool becomes a carnival. The Smudge forgets everything it was doing and goes on the teacups.")]};
var SUGAR_R={SUGGEST:[N("The sugar begins to make suggestions. The Smudge is overwhelmed by options and sits down to consider them.")],SUGARPLUM:[N("A thousand tiny sugarplums rain from the sky. The Smudge, being black, is very confused by them.")],SOGGY:[N("The sugar sags into a wet, soggy marsh. The Smudge slows to a squelch.")]};
var CANDY_R={CANDLE:[N("The candy cane becomes a candle. It lights, and the Smudge, which hates light, backs away muttering.")],CANARY:[N("The candy cane becomes a canary and sings so beautifully the Smudge stops to listen.")],CANNON:[N("The cane becomes a cannon. It fires one gumdrop, gently, to apologise.")]};
var LAST12=[N("The final lollipop on the road was bigger than the Smudge."),S_("Pocket","That one! The big one! It says LOLLIPOP!")];
var LOLLY_R={LOLLY:[N("The lollipop becomes a lolly. The Smudge takes one lick, sighs, and decides it wants to be a different shape.")],POPPY:[N("A whole field of poppies springs up. The Smudge falls asleep in them, dripping slowly.")],"LOLLIPOP OF FREEDOM":[N("The lollipop grows wings and flies off, taking the Smudge with it. They are delighted with each other.")]};
var ESCAPE12=[N("The Smudge was gone. The sugar fields were silent. Wren leaned on her knees and gasped."),S_("Pocket","That was... a lot of candy."),S_("Wren","The road isn't going to let us walk quietly, is it?"),S_("Pocket","It never does. But look. The thread's still there.")];
CH12.caught=CAUGHT;
/* ================= TEXT: CH13 ================= */
CH13.intro=[N("The road north ran straight for miles, with nothing on either side but flat, pale sugar. It was the most boring landscape Wren had ever seen."),S_("Pocket","Boring is good. Boring means nobody's chasing us."),S_("Wren","Boring is how it starts.")];
var HANS13=[S_("Hansel","Hello again!"),S_("Wren","Hansel? You were behind us."),S_("Hansel","Was I? I took the other road. It ended up here. Isn't that nice?"),S_("Pocket","Hansel. Which road?"),S_("Hansel","The one with the crumbs. Look! All my crumbs! The birds haven't touched these ones!")];
var LAMP13=[N("A candy lamppost stood by the road. A bird sat on it, a crumb in its beak."),S_("Hansel","Same lamppost. Same bird. Same crumb. I've seen it three times, and I think it's seen me."),S_("Pocket","Wren. Don't go past the crossroads."),S_("Wren","Why not?")];
var LOOP_A=[N("Wren walked on. The road bent. The lamp appeared. The bird was sitting on it, a crumb in its beak."),S_("Pocket","That's the same crumb."),S_("Wren","That's the same lamppost. We never turned. We never turned!"),S_("Pocket","It's a Loop. The Hush has frozen the road. We have to find the thing it keeps repeating, and change it.")];
var LOOP_B=[N("Again. The same lamp. The same bird. The same crumb. The bird looked at Wren, apologetic, as if it too wished for a different afternoon.")];
var LOOP_C=[N("Again.")];
var CRUMB_R={CRUMBLE:[N("The crumb crumbles. The bird, shocked, drops it for good. The whole afternoon cracks like a plate.")],CRUMPET:[N("The crumb becomes a crumpet. The bird eats it in one gulp and flies away, thoroughly satisfied. So does the afternoon.")],CRUSADE:[N("The crumb becomes a crusade. The bird salutes, picks up a tiny flag, and marches off north. The road marches after it.")]};
var BREAK13=[N("The air snapped like a bedsheet being shaken out. The road ahead was no longer pale. It was green, and wide, and truly going somewhere."),S_("Pocket","Loops always have an anchor. A small thing the story keeps repeating."),S_("Wren","A crumb."),S_("Pocket","Hansel's crumb. The whole road is built from him leaving a trail. And the Hush froze it.")];
var GRETELARR=[N("Behind them, a sharp voice cut the afternoon in half."),S_("Gretel","HANSEL!"),N("Gretel marched up the road with her ledger under one arm and a cake box under the other, followed by a pink and embarrassed Hansel."),S_("Gretel","You've broken a Loop. I felt it. My whole market ticked forward one minute. Do you know how long it's been since the clock ticked forward?"),S_("Hansel","Oh, it's wonderful!"),S_("Gretel","It's HORRIBLE. It's wonderful. Both.")];
var FREEBIE=[S_("Gretel","I owe you. A refund, nearly. I don't do refunds, so here's a secret. For free."),S_("Gretel","North of here, there's a beanstalk. The Giant isn't hoarding the sky's stories. Something is stealing them. The Giant is just the one who's been blamed."),S_("Pocket","The Hush?"),S_("Gretel","Probably. Everyone's blaming the biggest person present. It's an old habit. Ask Jack.")];
/* ================= TEXT: CH14 ================= */
CH14.intro=[N("That evening, the four of them walked in a row, Hansel in front scattering crumbs for no reason, Gretel behind him picking them up for the same reason."),S_("Hansel","I like this bit. It's the best bit. Nobody chases anyone."),S_("Gretel","Everyone says that. Then somebody gets chased.")];
var CRUMBBAG=[S_("Hansel","Wren. A present."),N("He pressed a small linen bag into her hands. It was warm and slightly sticky."),S_("Hansel","It's never empty. I put a spell on it. It's an accident, really. But it works. Whenever you're lost, drop one. It'll take you back."),S_("Wren","Back where?"),S_("Hansel","Wherever you started. Or somewhere close. It's not precise. But it's kind.")];
var COOKIE_R={COOKIES:[N("The cookie turns hard and sugary. It tastes of nothing, because everything does now.")],CAKE:[N("The cookie swells into a tiny cake with a candle. Wren blows it out and makes a wish. She keeps it to herself.")],CLOCK:[N("The cookie becomes a clock. It ticks. Somewhere far behind them, in a market, a stall wakes up.")]};
var GRETEL_GIFT=[S_("Gretel","A cookie. Not a secret. A cookie. Free."),N("Wren ate it. It was crisp. It was warm. It had butter in it, and cinnamon, and perhaps something with lemon. She knew all of this. She could taste none of it."),S_("Gretel","You can't taste it."),S_("Wren","No."),S_("Gretel","I'm sorry. I'd give it back if I could. I can't. That's the rule. It's a terrible rule. I don't make them, I only enforce them."),S_("Wren","It's fine."),S_("Gretel","It's not. Don't tell yourself it's fine. You're allowed to be sad about toast.")];
var NOTE14=[N("A slip of paper was tucked inside the cookie bag. Hester's writing, small and slanted."),N("‘Wren — if you can't taste it, you've paid. Eat it anyway. Taste isn't the only way to love toast. —H.’"),S_("Pocket","She knew. She knew you'd pay."),S_("Wren","She always knows. It's very annoying."),S_("Pocket","It's a gift. Tell her it's a gift.")];
var CLIMB=[N("The light changed. On the horizon, growing steadily, stood something enormous and green. It rose past the clouds and kept rising, a vine as wide as a village."),S_("Pocket","That's not a tree."),S_("Wren","That's not anything."),S_("Hansel","It's the Beanstalk! It's very tall! Mind your hat!"),S_("Gretel","Mind your secrets. Giants listen.")];
var PARTING14=[S_("Hansel","This is where we stay. We always stay. Our tale is the road."),S_("Gretel","Be careful. Be kind. Be suspicious of anything that's free."),S_("Wren","Even your cookie?"),S_("Gretel","That one was a mistake. I'll never do it again."),N("Wren turned to wave. Hansel was waving with both arms and dropping crumbs. Gretel was waving with one hand, and writing in her ledger with the other."),N("A green thread led on, upward, toward a vine as tall as the sky."),S_("Pocket","Beanstalk Reach. I like heights even less than sweets."),S_("Wren","You don't like anything."),S_("Pocket","I like you. In a rising, ever-expanding way.")];

/* ================= TEXT: CH15 ================= */
CH15.intro=[N("Stalkend was a village built in the shadow of something it never mentioned. Every house had its shutters closed. Every door had two locks."),S_("Pocket","Why does everyone look like they're hiding from the sky?"),S_("Wren","Because the sky's the other thing in the picture. Look up.")];
var GIANTSIGN_P=[N("A great painted board stood at the edge of the village. BEWARE THE GIANT. Beneath it, smaller, someone had scribbled: HE'S NOT THAT BAD. Beneath that: YES HE IS."),S_("Pocket","Public opinion is so thorough.")];
var GIANTSIGN_R={GENTLE:[N("The sign softens. A cheerful cloud drifts across the board and pats it on the head.")],GINGER:[N("BEWARE THE GINGER. A red-haired man on his doorstep takes it very personally.")],GIGGLY:[N("BEWARE THE GIGGLY. Windows open, one by one, as the village cautiously begins to chuckle.")]};
var JACK_A=[N("On a log at the end of the lane sat a man in a patched coat, coiling rope. He glanced up, saw Wren, and flinched, as if expecting her to throw something."),S_("Jack","I didn't do it. Whatever it is. I was here. Ask anybody. Nobody will tell you, but ask."),S_("Wren","I haven't accused you of anything."),S_("Jack","That's what they all say, right before."),S_("Pocket","Right before what?"),S_("Jack","Right before they blame me.")];
var JACK_B=[S_("Jack","I'm Jack. Jack-of-the-Stalk. I took one goose once. I was nine. It's been twenty-two years."),S_("Jack","Now every time something goes missing on the Reach, it's me. Or the Giant. Mostly me, because the Giant's too big to arrest."),N("Something small and gold-feathered strutted out from under the log and glared at Wren.")];
var TANSY_A=[S_("Tansy","Don't look at me like that. I know. I'm the goose. I'm not a goose. I'm a hen, and I'm tired."),S_("Pocket","She talks!"),S_("Tansy","I talk. I lay. I'm very valuable. Nobody ever asks if I want to be."),S_("Wren","What would you like to be?"),S_("Tansy","Ordinary. Do you know how rare that is for a gold hen? Ask me about omelettes sometime. It's bleak.")];
var TANSY_B=[S_("Jack","Your grandmother? Green shawl? She came through two days ago, climbed the stalk without a rope. Faster than me."),S_("Tansy","Said the sky was losing its stories. Said someone had to go and see."),S_("Wren","Then I'm going up."),S_("Jack","You can't. The stalk's guarded. By nobody. But it has a lot of confidence.")];
var BEAN_P=[N("Jack kept a clay jar on his windowsill. Inside, one bean glowed faintly, ticking like a tiny clock."),S_("Jack","Last one. The rest all grew. This one's... undecided. I can't tell if it wants to be a vine or a pudding.")];
var BEAN_R={BEAM:[N("The bean grows into a wooden beam. It props up the porch beautifully, and nobody argues with it.")],BEACH:[N("The bean becomes a small beach. A single deckchair unfolds and a gull settles into it, delighted.")],BEARD:[N("The bean grows a magnificent beard. It shakes the dust off it and asks Jack if he has any scissors.")]};
var ROPE_P=[S_("Jack","I'll come. Somebody has to carry the rope. Also if it all goes wrong, it'll be my fault anyway."),S_("Tansy","It's a gift. He's built for blame."),S_("Jack","But my rope's FRAYED. Look. One good tug and it's string.")];
var ROPE_R={FRIENDLY:[N("The rope uncoils itself, wags one end, and wraps around Jack's shoulders like a very old dog.")],FRESH:[N("The rope shakes off its fray, stiffens, and smells vaguely of new twine and optimism.")],FRIED:[N("The rope sizzles. It is crispy, golden, and still extremely strong. Tansy asks if it's salted.")]};
var STALKBASE=[N("The Beanstalk rose from a ring of enormous roots at the edge of the village, thick as a mill and green as a promise. It went up, and kept going up, and the top was in the clouds, and the clouds were beneath something else."),S_("Jack","It's not that bad once you stop looking down."),S_("Tansy","It's not that bad once you stop looking at all."),S_("Wren","Pocket?"),S_("Pocket","I'm going to hold the cork very tightly.")];
/* ================= TEXT: CH16 ================= */
CH16.intro=[N("The vine wound around the stalk like a spiral staircase built by someone who had heard of stairs but not of handrails."),S_("Jack","Left foot. Right foot. Don't count the clouds."),S_("Pocket","I'm counting the clouds."),S_("Jack","Don't.")];
var JACKTALK=[S_("Jack","You know what the worst part is? I didn't want to steal the goose. I wanted to be someone who didn't need to."),S_("Tansy","And now you're someone who steals nothing and gets blamed for everything. You've really moved up."),S_("Jack","I'm thinking of moving to the sea."),S_("Tansy","You'd be blamed for the tide.")];
var LEAF_P=[N("A leaf the size of a barn door hung off the vine, quivering. A word glowed on its surface."),S_("Pocket","That leaf has a word on it. It looks nervous.")];
var LEAF_R={LEAD:[N("The leaf becomes lead. It drops straight off the vine and bangs in the cloud-mist below like a distant door.")],LEAP:[N("The leaf springs like a trampoline. Everyone bounces up forty feet, giggling, and lands neatly on the next bend.")],LEAK:[N("The leaf springs a tiny leak. Cool green water trickles out, and everyone drinks. It tastes like lettuce and weather.")]};
var HEN_EGG=[N("Tansy flapped up onto a ledge, shook herself, and laid an egg. It was gold. It rolled off the edge and fell into the mist."),S_("Tansy","Someone will find that. Someone will be very happy. I hope it hits them."),S_("Jack","Tansy."),S_("Tansy","I hope it only hits them a little.")];
var CLIMB2=[N("The air changed. It grew thin, cool, and almost silver. The green ran out of the vine. Above them, the clouds looked like stairs."),S_("Pocket","Wren. Look down."),S_("Wren","You said never look down."),S_("Pocket","I'm making an exception. It's beautiful.")];
var SPLIT_P=[N("The vine ahead had cracked down the middle, a gap too wide to jump, with a word glowing over the split."),S_("Jack","SPLIT. Of course. Everything breaks the day I'm in a good mood.")];
var SPLIT_R={SPLINT:[N("A neat wooden splint wraps the crack. The vine thanks them, very quietly, and holds firm.")],SPLASH:[N("The crack fills with water. A small waterfall arcs across the gap. Everyone crosses by a rainbow, which is rude of it to appear so suddenly.")],SPLENDID:[N("The vine decides to be splendid. It knits itself back together, buds a few golden flowers, and bows.")]};
var ABOVE=[N("They climbed through the last of the mist, and the world opened out like a book."),N("Cloud-hills. Cloud-lanes. Roofs the colour of breath. A whole country made of white, drifting slowly in a pale blue sky, with no ground at all beneath it."),S_("Wren","It's real."),S_("Pocket","It's real. And it's quiet. Why is it so quiet?"),S_("Tansy","Because something took the noise.")];
/* ================= TEXT: CH17 ================= */
CH17.intro=[N("Cloud Country rose gently around them. Houses of fog. Gardens of mist. A sign that read: WELCOME, PLEASE WIPE YOUR FEET (WE'LL FALL THROUGH IF YOU DON'T)."),S_("Pocket","Where are all the people?"),S_("Jack","They're shy. Or they've been robbed.")];
var CUM_A=[N("A round, drifting man in a damp waistcoat floated out of a doorway, wringing a handkerchief."),S_("Mayor Cumulus","Visitors! Oh, thank the weather. You're not the Giant? No. You're quite small. Good."),S_("Mayor Cumulus","I'm Cumulus. Mayor. Rain Clerk, Wind Registrar, and chief of Everything. Things have gone quite wrong. Would you like a cloud? It's damp, but sincere.")];
var CUM_B=[S_("Mayor Cumulus","We keep stories in the rain. Every drop of rain here is a tiny story. They fall, they water the fields, they return as dew. It's very efficient."),S_("Mayor Cumulus","Four days ago it stopped. The rain stopped. The stories ran dry. Someone took the whole Vault."),S_("Wren","And you think it was the Giant."),S_("Mayor Cumulus","Well. He's the biggest person present. It's an old rule.")];
var CLOUD_P=[N("A cloud drifted past, bearing a very small word on its belly."),S_("Pocket","CLOUD. Edit it. Please. For my nerves.")];
var CLOUD_R={CROWD:[N("The cloud swells into a crowd of cheerful puffs, all waving, all talking, none of them at all sure why.")],CLOWN:[N("The cloud becomes a clown. It juggles three raindrops, honks a small nose, and floats away to find a very small birthday.")],CLOAK:[N("The cloud becomes a cloak. It drapes itself, with great dignity, over Mayor Cumulus's shoulders. He's astonished and, privately, delighted.")]};
var VAULT_P=[N("The Vault was a pearl-grey dome at the end of the lane, with a door made of solid fog. Nothing was moving inside it."),S_("Mayor Cumulus","SHUT. It's been shut for four days. I don't have the key. It doesn't have a keyhole. We've tried asking nicely."),S_("Pocket","It's a word, Wren. It's always a word.")];
var VAULT_R={SHOUT:[N("The door shouts, 'OPEN!' and is so embarrassed that it opens, at once, and apologises.")],SHUTTLE:[N("The door becomes a shuttle. It zips along its track, hums, and delivers Wren politely inside.")],SHOE:[N("The door becomes a shoe. Wren steps through it. It is surprisingly comfortable.")]};
var VAULT_IN=[N("Inside, the Vault was a hall of bottles, each one the size of a lamppost, each one empty. A single band of frost lay across the floor, thin and cyan and humming."),S_("Pocket","The Hush."),S_("Wren","It didn't take them. It froze them. Look, the frost goes all the way along."),S_("Pocket","And then something took them. Something that follows the frost.")];
var CUM_C=[S_("Wren","It wasn't the Giant. The frost isn't his. Whatever it is, it went north. To his castle."),S_("Mayor Cumulus","The castle? Why would it go there?"),S_("Wren","Because it's the biggest place on the map. It wanted to make him look guilty."),S_("Pocket","That's... annoyingly clever. For a villain.")];
var SEND17=[S_("Mayor Cumulus","Take my weather vane. It points to the truth. Or north. It's hard to tell."),N("The vane was a tiny silver arrow. It spun, wobbled, and pointed directly at a mountain with a castle for a hat.")];
/* ================= TEXT: CH18 ================= */
CH18.intro=[N("The road to the Giant's castle was paved with hailstones, polished smooth by the weather. Every pebble was the size of a loaf."),S_("Jack","I've never come this close. Not once. I'm trying not to hum."),S_("Tansy","You hum when you're nervous."),S_("Jack","I hum when I'm happy."),S_("Tansy","You've never been happy.")];
var CASTLE_A=[N("The castle rose like a mountain someone had politely tidied. A drawbridge as wide as a street. A door the size of a church. And on the door, in enormous letters, was written FEE FI FO FUM."),S_("Pocket","I hate this. I hate this entirely.")];
var FUM_P=[S_("Jack","FUM. That's what it says. Fee, fi, fo, fum. He's required to say it. It's in the contract."),S_("Wren","Whose contract?"),S_("Jack","The Giant's. Under the Reach Act. Nobody's read the Act. I'm not sure anyone wrote it.")];
var FUM_R={FUN:[N("The door reads FEE FI FO FUN. It flings itself open, and a gust of warm bread-smell sweeps over them.")],FUME:[N("The door gives off a polite, grey fume, coughs, and opens.")],FUDGE:[N("FEE FI FO FUDGE. The door melts into a thick brown puddle, and a hand-painted sign appears: PLEASE DO NOT EAT THE DOOR.")]};
var HUM_A=[N("Behind the door stood a giant. He was as tall as a barn and as wide as a hill, and he was wearing a pinafore with strawberries on it."),S_("Humbert","Fee. Fi. Fo. Fum. I'm sorry. I'm so sorry. It's the contract. I never mean it."),S_("Wren","We're not frightened."),S_("Humbert","Really? Oh, that's lovely. Everyone's always frightened. Do you take sugar? Do you take it in a thimble?"),S_("Tansy","Is that a thimble?"),S_("Humbert","It's my largest tea cup. Don't judge. They're very hard to find in my size.")];
var HUM_B=[N("Giant Humbert's kitchen was warm, vast, and spotless. The kettle was the size of a rowing boat. A mouse on the counter was knitting him a scarf."),S_("Humbert","I bake. I read. I mend clouds for the neighbours. And every time something goes wrong, someone climbs the stalk and shouts at my door."),S_("Humbert","They never ask me a single question. They just stand on the drawbridge and tell me what I've done."),S_("Wren","I'm asking. Did you take the stories?"),S_("Humbert","No. I'd never. I love them.")];
var TEA_P=[N("Humbert poured tea into a thimble. The thimble had a word engraved on it."),S_("Humbert","It says TEA. My mother's idea. She thought it'd bring us together.")];
var TEA_R={TEAM:[N("A very small team of tea-drinkers materialises, shakes hands, and drinks it in shifts.")],TEAR:[N("The tea turns salty. Humbert, a tender soul, begins to weep into a handkerchief the size of a sail.")],TEAK:[N("The thimble becomes teak. It is a beautiful cup. It cannot hold tea, but it is beautiful.")]};
var HARP=[N("In the corner stood a golden harp taller than a tree. It was quietly playing something old, over and over, a lullaby with a gap at the beginning, like a stair missing from a flight."),S_("Wren","I know that tune."),S_("Humbert","Do you?"),S_("Wren","It's... I can hum it. Almost. The start's gone. The start is missing."),S_("Pocket","Wren. That's the first note. The one the Redactor took."),S_("Humbert","The harp's played that since the boy came. Years ago. A boy with ink on his fingers. He wanted to borrow the ending of the sky's stories."),S_("Wren","What did you say?"),S_("Humbert","I said no. I said some endings aren't for borrowing. He left angry. He was very polite about it. That's what frightened me.")];
var HUM_C=[S_("Humbert","The thief took the Vault stories and left a trail of frost to my door. I'd follow it myself. But if I leave the castle, the whole Reach will say it was me."),S_("Jack","I'll tell them. I'll stand up on the drawbridge and say it was me. They'll believe that."),S_("Humbert","You don't have to."),S_("Jack","I do. I've been blamed my whole life. I may as well be useful.")];
var SMUDGE_ARR=[N("The tea in every cup went pale and cold. The frost rushed in at the window. A sound filled the kitchen, like a very large sheet of paper being torn very slowly."),S_("Pocket","It came back for the harp."),S_("Humbert","The window! Everyone out! Everyone out!")];
/* ================= TEXT: CH19 ================= */
CH19.intro=[N("They ran. The cloud-road bucked and rolled like a sea. Behind them, a shape the size of a house poured over the hill, thick as ink and hungry as a library fire."),S_("Pocket","It's a Smudge. It's a very large Smudge. It's the Smudge that eats the Smudges!"),S_("Humbert","Run! I'll hold the roof!")];
var STORM_R={STORK:[N("The storm becomes a stork. It looks at the Smudge, then at its own legs, and flies off in an offended flap.")],STORE:[N("The storm becomes a storeroom. The Smudge sniffs, reads the sign, and goes in to browse.")],STORY:[N("The storm becomes a story. The Smudge freezes, mesmerised, and listens to the first page with its whole body.")]};
var BOLT_R={BOLD:[N("The lightning grows bold, struts, steps off the cloud and takes a bow. The Smudge claps.")],BOOT:[N("The lightning becomes a boot. It kicks the Smudge gently, apologises, and hops off.")],BOLTED:[N("The lightning bolts. It rushes off in the wrong direction at enormous speed, trailing the Smudge behind it by accident.")]};
var FLASH_R={FLASK:[N("The flash becomes a flask. The Smudge sips from it, discovers it is cocoa, and stops for a moment out of sheer surprise.")],FLUSH:[N("The flash becomes a flush of pink. The Smudge is deeply embarrassed and has to sit down.")],FLASHY:[N("The flash becomes flashy. Sequins fall from the sky. The Smudge is very impressed by them.")]};
var THIEF_P=[N("At the cliff's edge, with nowhere left to run, Wren turned. The great black shape lowered itself over the cloud. In its middle, glinting, hung a hundred tiny jars. The stolen stories."),S_("Pocket","Wren. The word.")];
var THIEF_R={CHEF:[N("The Smudge is suddenly a chef, in a tall white hat, with a ladle. It looks at its hands, at the jars, at Wren. It seems terribly sorry.")],CHIEF:[N("The Smudge becomes a chief, in a feathered cap, and gravely, ceremonially, hands every jar back.")],CHILD:[N("The Smudge shrinks to the size of a small, damp child. It puts the jars down in a row, sniffs, and looks up at Wren as if waiting to be told it has done something wrong.")]};
var THIEF_AFTER=[N("The jars floated up, one by one, and burst. Rain fell on Cloud Country for the first time in four days. Every drop was a word. Every word was a story."),N("Down in the lanes, the cloud-folk ran out of their doors with their faces turned up, and laughed."),S_("Pocket","It wasn't the Giant."),S_("Wren","It never was."),N("The Smudge, small and soggy, sat on the cliff's edge, and watched the rain. It did not seem to mind being watched.")];
/* ================= TEXT: CH20 ================= */
CH20.intro=[N("It rained stories all the way down to the edge of Cloud Country, and nobody minded getting wet."),S_("Mayor Cumulus","Giant Humbert's been named Honorary Mayor of the Weather. He's very embarrassed."),S_("Jack","So am I. They gave me the key to the Vault. I don't know what to do with a key.")];
var GIFT20=[S_("Humbert","Wren. Take this."),N("From a pinafore pocket the size of a tent he drew a small glass jar with a single, shimmering drop in it."),S_("Humbert","It's a story. A little one. It was stolen once. Now it's only borrowed. When you need to know how something ends, open it."),S_("Wren","What's it about?"),S_("Humbert","Whatever you need it to be.")];
var JACK20=[S_("Jack","I'll go down with you. Part of the way. I've got a rope and nothing to be blamed for."),S_("Tansy","Don't speak too soon."),S_("Jack","I'll take it back."),N("He laughed. It was the first time Wren had heard it. It was a surprising sound, loud, creaky, and full of birds.")];
var EGG_R={ORDINARY:[N("The egg becomes ordinary. Tansy stares at it for a long time. Then, very quietly, she sits on it.")],OMELETTE:[N("The egg becomes an omelette. Tansy looks at it, looks at Wren, and says nothing. It was too soon.")],OSTRICH:[N("The egg becomes an ostrich egg. The ostrich is furious. The ostrich is also, curiously, a gold-feathered hen.")]};
var EGG20=[N("Tansy waddled up and dropped something at Wren's feet. A plain brown egg."),S_("Tansy","Ordinary. Do you know how rare that is?"),S_("Tansy","I laid it last night. By accident. It's not gold. It's not a prize. It's just an egg. It's mine."),S_("Tansy","I'd like you to have it. Don't eat it. Don't hatch it. Don't let anyone value it."),S_("Wren","I'll keep it safe."),S_("Tansy","Keep it ordinary. That's the best kind of safe.")];
var NOTE20=[N("The egg came with a slip of paper tucked under it. Hester's handwriting, small and slanted."),N("‘Wren — the Thornwall is next. A girl who slept a hundred years because someone was careless with a spindle. Don't touch the spindle. Rosamund will explain. And Wren — good job. I always knew you would. —H.’"),S_("Pocket","She knows everything."),S_("Wren","She's one step ahead. Always one step. I'd like to catch up, just once."),S_("Pocket","Then walk faster.")];
var VIEW20=[N("Far below, through a gap in the cloud, the world unrolled like a map. Rivers, roofs, forests, and on the northern edge, a line of dark green, dense as a wall."),S_("Jack","The Thornwall. Nobody goes through. Not even me."),S_("Tansy","Nobody goes through, so everybody's been very quiet about it."),S_("Wren","Then it's exactly the right place to go.")];
var PART20=[S_("Jack","This is where we stay. We belong up here."),S_("Tansy","Be careful on the way down. The stalk's slippery. And the Thornwall's thorny. Obviously."),S_("Humbert","Come back for tea. I'll find a bigger thimble."),N("Wren turned once to wave. Jack was waving with the rope. Tansy was sitting on an egg and pretending not to. Humbert was waving with a tea towel the size of a sail."),N("A green thread led on, down the north side of the clouds, toward a line of thorns."),S_("Pocket","Thornwall. I do not like thorns."),S_("Wren","You don't like anything."),S_("Pocket","I like you. In a somewhat prickly way.")];

CH21.intro=[N("The Thornwall wasn't a wall. It was a decision. A hundred miles of hedge, taller than any tower, thick as a library, and every single thorn was pointing the same way: out."),S_("Pocket","I'd like to go on record: I'm against it."),S_("Wren","You're against everything."),S_("Pocket","I'm against it specifically, and with evidence.")];
var HEDGE_A=[N("The hedge began to speak as they came near. It spoke in a creaking, rhyming murmur."),S_("Thorns","Go back, go back, there's naught to see. A sleeping kingdom, sleeping free."),S_("Thorns","Go back, go back, it's not for you. We've pricked a prince or maybe two."),S_("Wren","Do they have to rhyme?"),S_("Pocket","They've had a hundred years. It's a coping mechanism.")];
var BACK_P=[N("A signpost stood beside the track. GO BACK, it said, in hopeful, slightly desperate capitals.")];
var BACK_R={BAKE:[N("GO BAKE. A passing cloud takes a deep breath, pulls out a very small apron, and gets started.")],BACON:[N("GO BACON. Everyone in the district is suddenly, intensely hungry.")],BLACK:[N("GO BLACK. The sign gloomily rolls itself into a cape and sulks behind a tree.")]};
var NOD_A=[N("At the foot of the hedge, a guard in a dented helmet sat on a three-legged stool, fast asleep. His snores rolled across the grass like a distant cart."),S_("Sergeant Nod","...Halt. Who goes. Who. Halt. It's a... pig. A pig with a spear. Nobody told me."),S_("Pocket","He's talking in his sleep."),S_("Sergeant Nod","Permission to... permission to marmalade."),S_("Wren","He's been asleep a hundred years?"),S_("Pocket","No. He's been asleep about nine. He was on shift when the curse hit. He's one of the early ones.")];
var YAWN_P=[N("A great, slow yawn spread across the field. Wren caught it, and Pocket caught it, and a nearby rabbit caught it and fell over."),S_("Pocket","Don't. Yawn. Yawns are contagious. Everything is, here."),S_("Wren","I'm not tired."),S_("Pocket","That's what the rabbit said.")];
var THORN_P=[N("The path ended at a gap in the hedge, barely wide enough for a sheep, and the thorns on both sides were curling forward, glinting, a little embarrassed."),S_("Thorns","Go back."),S_("Wren","Please."),S_("Thorns","...Go back, please."),S_("Pocket","They're negotiating. This is the best I've seen them do. Wren. The word.")];
var THORN_R={THRONES:[N("The thorns bloom into velvet thrones, one after the other, in a long red avenue. Wren is escorted down it, a bit worried about being treated like a monarch.")],THANKS:[N("The thorns stop in mid-prickle and say, 'Thanks.' It isn't clear what for. They part like curtains.")],THREADS:[N("Every thorn softens into a thread of green wool. The hedge unravels neatly, row by row, and a path opens like a held breath.")]};
var THORN_AFTER=[N("They stepped through, and the hedge closed gently behind them, like a book."),N("Beyond lay a kingdom made of gold light. Roofs, spires, a river that wasn't moving, a bird in the sky that was not quite flying. Everything was still."),S_("Pocket","It's beautiful."),S_("Wren","It's the same moment. All of it. Over and over."),S_("Pocket","It's the Hush's favourite kind of place. It doesn't have to do a thing. They did it to themselves.")];
/* ================= TEXT: CH22 ================= */
CH22.intro=[N("The town of Brierhold had gone to sleep in the middle of a Tuesday. It was very clear, because nobody had finished anything."),S_("Pocket","Mind the baker."),S_("Wren","Which one?"),S_("Pocket","All of them.")];
var TOWN_A=[N("A cobbler lay across his workbench with a shoe in each hand. A cat hung in the air above a dish of milk. A baker slept standing, a tray of buns balanced on her head, her mouth open in the shape of the word OH."),S_("Wren","They're not dead."),S_("Pocket","They're not anything. They're stopped. It's worse.")];
var BAKER_P=[N("Above the baker's head, a little silver bubble hung, a dream trapped in the air. Something glowed inside it.")];
var BAKER_R={FLOWER:[N("The bubble bursts into a bright bouquet. Every sleeper nearby sighs, and one of them smiles in her sleep.")],FLAIR:[N("The bubble fills with flair. The baker, still asleep, executes a magnificent pirouette and returns to her original pose.")],FLUTE:[N("A flute appears inside the bubble and plays a short, sleepy tune. The cat above the milk twitches a whisker.")]};
var PRINCE_A=[N("In the market square a young man sat on a bench, a pen in one hand and a blanket on his knees. He was not asleep. He was writing very fast."),S_("Prince Orlo","Don't talk to me. I'm apologising. I've been apologising for a hundred years. I'm up to the letter Q."),S_("Wren","Who to?"),S_("Prince Orlo","Rosamund. I kissed her without asking. In the tale. In the old version. She said it was 'a lot, frankly.' Then she got up and made tea."),S_("Pocket","So the tale did end."),S_("Prince Orlo","It ended. Then it started again. Same Tuesday. I don't know which of us it hurts more.")];
var FAIRIES_A=[N("Three tiny women in different shades of faded pink came skittering across the cobbles, bickering at the top of their voices."),S_("Fairy Wimble","It's not the TOWN that's asleep. It's the TIME."),S_("Fairy Thrum","The town is asleep. I can SEE the town. It's got its eyes shut."),S_("Fairy Pettigrew","We're the Three Good Fairies. We're from the Guild. We bless things. Mostly we bicker, but with love."),S_("Fairy Wimble","Don't mention the spindle. We've mentioned it. It's under control."),S_("Fairy Thrum","It's not under control. It's in a cupboard.")];
var SNORE_P=[N("A giant of a man lay across the bridge, as wide as the road and as heavy as a barn, snoring like a bellows."),S_("Fairy Pettigrew","The Bridge-Keeper. He's blocking the only bridge. A hundred years we've asked him politely to roll over."),S_("Fairy Wimble","Politely isn't a spell."),S_("Pocket","Wren. The word.")];
var SNORE_R={SNORT:[N("The Bridge-Keeper snorts. It is magnificent. It blows him a clean yard to the left, and the bridge is clear.")],SNOWY:[N("It begins to snow lightly on the Bridge-Keeper. He rolls over, mutters, 'Five more minutes,' and clears the way entirely.")],SNORKEL:[N("A snorkel pops out of the Bridge-Keeper's nose. He bobs up on a sudden wave and floats gently off downstream, still asleep.")]};
var FAIRIES_B=[S_("Fairy Thrum","Rosamund! You want Rosamund. She's the only one awake. Up at the castle."),S_("Fairy Wimble","Don't mention the cursing."),S_("Fairy Pettigrew","She's very cross. About the sleep. About the lack of it."),S_("Wren","She's awake?"),S_("Fairy Wimble","Three days now. She hasn't slept a wink. It's the cruellest curse of all.")];
var HAIL22=[N("The castle rose beyond the river, pink stone and golden flags, every flag hanging dead still in the dead still air."),S_("Pocket","Don't say it."),S_("Wren","Say what?"),S_("Pocket","'What could go wrong.' Don't say it. Don't even think it.")];
/* ================= TEXT: CH23 ================= */
CH23.intro=[N("The castle gardens had been trimmed by someone who hadn't slept in days. The hedges were perfect. The roses were frantic."),S_("Pocket","I think the gardener's gone a bit mad."),S_("Wren","It's not the gardener. Look. Somebody's been pruning at three in the morning.")];
var ROSA_A=[N("A young woman in a dressing gown and one slipper sat on a stone bench, staring at a cup of tea as if it had personally let her down. Beneath her eyes were two lilac thumbprints."),S_("Rosamund","Don't tell me. A visitor. How lovely. I'm Rosamund. The one from the story. The sleeping one."),S_("Rosamund","I'd offer you tea but it's my fourteenth cup and I don't trust it."),S_("Wren","The fairies said you couldn't sleep."),S_("Rosamund","I can't. I've tried everything. Counting sheep. Counting sheep who count sheep. I lay in the dark and a hedgehog read me a lecture on ferns.")];
var ROSA_B=[S_("Rosamund","Here is the scandal. The whole kingdom sleeps, and I'm the one who's awake, because I'm the only one the spindle can't touch any more. Everyone else is frozen in the Hush. And I'm the one left with nothing to do and no one to talk to."),S_("Rosamund","That's the curse. Not the sleeping. The waking. I'd give anything for a nap."),S_("Wren","Has someone been here? A woman in a green shawl?"),S_("Rosamund","Hester. Yesterday. We had tea. Seven cups. She was the only person in a hundred years who didn't ask if I'd tried warm milk.")];
var ROSA_C=[S_("Rosamund","She went up the east tower. To see the Thirteenth Fairy. She hasn't come down."),S_("Rosamund","Dame Vesper. The one who wasn't invited to my christening. She's not what the stories say. She's... complicated. And very good at silence."),S_("Pocket","The spindle?"),S_("Rosamund","In the Gallery. The Hush gets in through it. It's been feeding on my sleep for a hundred years. That's why I can't have any. It's all being eaten.")];
var YAWN_R={YARN:[N("The yawn turns into a ball of yarn. It rolls across the lawn, unravelling a long, comfortable scarf for a very cold hedge.")],YAK:[N("The yawn becomes a yak. It shakes itself, looks at Rosamund with great calm, and sits on her feet. She is deeply comforted.")],YOLK:[N("The yawn cracks into an egg yolk, which sits in the sunshine looking pleased with itself.")]};
var DOWN_P=[N("The castle's portcullis hung low across the gate, black iron, studded with bored little spikes. A word was carved in the crossbar."),S_("Rosamund","DOWN. It's been down since the curse. I'd lift it myself but I have no upper body strength. I'm a princess."),S_("Pocket","The word, Wren.")];
var DOWN_R={DOWAGER:[N("A formidable Dowager steps out from nowhere, lifts the portcullis with one hand, and says, 'In my day we didn't need curses to stay in.'")],DOWNY:[N("The portcullis turns to feathers. It floats into the air in a soft, vast, drifting cloud.")],DOWSE:[N("Water pours out of the crossbar. The portcullis rises, thoroughly rinsed.")]};
var ROSA_D=[S_("Rosamund","Tea? No. Of course not. Come up to the Gallery. I'll show you the spindle. It's a very ordinary spindle, which is the awful part."),S_("Wren","Rosamund. Do you really want to sleep?"),S_("Rosamund","More than anything I've ever wanted."),S_("Rosamund","But I don't want to sleep for a hundred years. I want a Tuesday night. Eight hours. A hot water bottle. A dream about nothing."),S_("Pocket","That's a very small wish."),S_("Rosamund","That's why it's so hard.")];
/* ================= TEXT: CH24 ================= */
CH24.intro=[N("The east tower twisted up into the sky like a stick of black liquorice. The stairs went round and round the outside, no rail, no landing, no sign of an end."),S_("Pocket","I don't like heights."),S_("Wren","You're an inkpot. You're about six inches high."),S_("Pocket","Six inches is a very great height when you're falling.")];
var TOWER_A=[N("Halfway up the stairs the wind brought a smell of old tea, cold wax, and something very sad."),S_("Wren","Someone's been up here a long time."),S_("Pocket","Someone's been up here alone."),N("A line of frost ran along the wall, as thin and bright as a hair.")];
var NOT_P=[N("On a black door at the top of the tower hung a brass plaque. It read: NOT WELCOME. THIS MEANS YOU."),S_("Pocket","I think that's meant to be intimidating."),S_("Wren","It's got a doily underneath.")];
var NOT_R={NOW:[N("NOW WELCOME. The plaque blinks, scrubs the doily, and says, 'Wipe your feet. Not on the carpet. On the floor.'")],KNOT:[N("KNOT WELCOME. The plaque ties itself in a tidy bow. A green thread runs from it, under the door, into the gloom.")],NOTE:[N("NOTE WELCOME. A tiny card slides from under the door: 'Please come in. I have not spoken to anyone in eleven years. Mind the cat.'")]};
var VESPER_A=[N("The Thirteenth Fairy turned out to be tall, thin and very tired. She wore a long black gown with a high collar, and she stood on the spindle with both feet, like a woman standing on a lid."),S_("Dame Vesper","You'll be Wren. Hester said you'd come."),S_("Pocket","She said that?"),S_("Dame Vesper","She said many things. She said, 'Don't let them make you a villain.' I said I'd already been one for a century. I'd rather be a fairy."),S_("Wren","They say you cursed the princess."),S_("Dame Vesper","I was not invited to the christening because they only had twelve plates. I put a cold on the baby. A cold, Wren. Everyone else added the spindle.")];
var VESPER_B=[S_("Dame Vesper","The spindle's the Hush's door. I've stood on it for eleven years, to keep it from opening wider. If I step off, the frost gets into the whole kingdom. And then it gets out."),S_("Wren","Where is my grandmother?"),S_("Dame Vesper","Gone. Last night. She took the Back Stair. She had something she needed to put right."),S_("Dame Vesper","She left this."),N("From her sleeve, Vesper drew a small, old, worn leather purse. A faded green thread hung from the clasp.")];
var VESPER_C=[S_("Dame Vesper","Wren. Listen. Hester did not tell you everything, because she is a coward about the things she loves."),S_("Dame Vesper","Stories keep books. When you change one, it balances. Something must be paid. For the Unwritten, the cost comes out of you."),S_("Wren","I've already lost two things."),S_("Dame Vesper","A song's first note. The taste of toast."),S_("Wren","How do you know?"),S_("Dame Vesper","Because I've lost nineteen things, over eleven years, standing on this lid. Nobody warns you. Nobody says. You just wake one morning and your mother's name has a gap in it."),S_("Pocket","That's... horrible."),S_("Dame Vesper","It's how the book keeps. It's the Erasure. I don't know who invented it. I'd like to meet him. I've got a spindle for him.")];
var VESPER_D=[S_("Wren","Then I'll stop. I won't edit anymore."),S_("Dame Vesper","Then the Hush wins. The kingdom stays frozen. Hester stays gone. Your whole road stays a loop."),S_("Wren","That's not a choice."),S_("Dame Vesper","No. It's a price. I'm sorry. I would take it for you if I could. I can't. The pen only writes your hand.")];
var VESPER_E=[S_("Dame Vesper","Here is what you must do. In the Gallery, the spindle's room, the Hush has a Drowse. A cloud that puts people to sleep, to keep them from finishing what they start."),S_("Dame Vesper","Run it down the Gallery. Take it to Rosamund's room. Write the last line of her story. Let her sleep, and let the others wake."),S_("Wren","What do I pay?"),S_("Dame Vesper","I don't know. I can only tell you it will be something you didn't know you'd miss.")];
/* ================= TEXT: CH25 ================= */
CH25.intro=[N("The Gallery ran the length of the castle, a long hall of marble pillars and sleeping portraits, with a red carpet down the middle like a tongue. At the far end, a door waited."),N("Behind them, something soft, grey and drowsy rolled in through the tower door, yawning as it came."),S_("Pocket","The Drowse! It's the Drowse! Don't breathe in! Don't YAWN!"),S_("Wren","I can't help it, I'm already—"),S_("Pocket","RUN!")];
var DROWSE_R1={SLEET:[N("The sleep-cloud curdles into sleet. It stings, spits, and retreats under a nearby statue.")],SLEEK:[N("The cloud becomes sleek and shiny, and slips on its own polish across the Gallery floor.")],SLEEVE:[N("The cloud becomes a sleeve. It's a very good sleeve, with a button and a cuff, and it has no idea what to do next.")]};
var DROWSE_R2={PILLAR:[N("A pillar springs up in the Drowse's way. It trips, rolls round it twice, and is briefly, sincerely confused.")],PELLET:[N("The pillow becomes a tiny, hard pellet. The Drowse tries to lie on it and instantly regrets its life choices.")],PILLOWCASE:[N("The pillow becomes a pillowcase. The Drowse tries to sleep in it, finds it empty, and goes to look for the filling.")]};
var DROWSE_R3={BEAD:[N("The bed becomes a single bead. It rolls away down the carpet and the Drowse rolls after it.")],BEET:[N("The bed becomes a beet. The Drowse looks at it, looks at the portrait on the wall, and gives up.")],BREAD:[N("The bed becomes bread, warm, soft and rather cosy. The Drowse sinks in, sighs, and starts to make toast.")]};
var END25=[N("The door at the end of the Gallery stood open. Beyond it, in a round room full of afternoon light, was a spindle on a stand, no larger than a hairbrush."),S_("Pocket","That's it. That's the whole thing. That's the Hush's door."),S_("Wren","It looks so ordinary."),S_("Pocket","That's why it's dangerous.")];
/* ================= TEXT: CH26 ================= */
CH26.intro=[N("The Drowse hung in the doorway behind them, vast and grey and slowly deflating, like a sigh."),S_("Rosamund","Is it dead?"),S_("Pocket","It's resting. Just like you should be.")];
var LAUGH=[N("Wren stood in front of the spindle, the pen in her hand, the page already glowing. She felt very tired. She wasn't sure why."),S_("Pocket","Wren. Before you write. Tell me something."),S_("Wren","What?"),S_("Pocket","Tell me what it sounds like when your grandmother laughs. I want you to hold it, before. In case."),S_("Wren","Hester's laugh is... it's like a tray of spoons being dropped down a stair. In a happy way. It starts as a squeak. Then it's the whole kitchen."),S_("Wren","It's the best sound I know. I'd know it in the dark."),S_("Pocket","Good. Keep that. As long as you can.")];
var ROS_PRE=[S_("Rosamund","Wren. Do I get to sleep? Really?"),S_("Wren","I think so."),S_("Rosamund","I don't want you to pay for it. I'd rather stay awake."),S_("Wren","It's all right. I'd rather."),S_("Rosamund","That's a terrible thing to say to a person who's about to fall asleep on her feet."),N("She said it very kindly, and then she yawned.")];
var LAST_R={"AND SHE SLEPT UNTIL MORNING":[N("‘...and she slept until morning, eight whole hours, with a hot water bottle and a dream about nothing at all.’"),N("Rosamund crumples, gently, onto a nearby sofa. Her face goes slack and peaceful. Her slipper falls off.")],"AND THE KINGDOM WOKE AT LAST":[N("‘...and the kingdom woke at last, every one of them, and nobody remembered how long it had been.’"),N("Down in the town a hundred thousand people sit up in bed at once, blink, and say, 'Is it Tuesday?'")],"AND SHE TOOK A NAP":[N("‘...and she took a nap. A short, ordinary, deeply satisfying nap. And that was enough.’"),N("Rosamund lies down, fits her cheek to her hand, and breathes out. It is the smallest, rightest sound.")]};
var AFTER26=[N("The spindle cracked, gently, in two. A thin cyan frost trickled out of it and melted on the floor."),N("Through the window, the flags began to move. A bird, hanging in the sky for a hundred years, finished its flap."),N("Down in the town, a hundred thousand things started at once. A cat landed in a saucer of milk. A bun fell off a baker's head. A bridge-keeper, floating downstream, woke up and said, 'This isn't my bed.'"),S_("Pocket","You did it. You did it, Wren. They're all awake. They're all... Wren?"),S_("Wren","I'm all right.")];
var LOST26=[S_("Pocket","Wren. Tell me about Hester's laugh."),S_("Wren","It's... a laugh. It's, um, it's loud?"),S_("Pocket","What does it sound like?"),S_("Wren","I... it sounded like..."),N("Wren stopped. She put her hand to her chest, where the sound had been. There was a quiet, shaped hole, as neat as a button gone from a coat."),S_("Wren","I know she laughed. I know it was the best sound. I can see her face. I can't hear it. I can't hear it, Pocket."),S_("Pocket","I know. I'm so sorry."),S_("Wren","It's gone. It's not even... there's nothing there to miss. It's just a shape.")];
var COMFORT26=[S_("Pocket","Then we'll find her. And she'll laugh again. And you'll hear it for the first time, all over again."),S_("Wren","That's... that's actually a nice way to put it."),S_("Pocket","I have my moments. They're rare. Don't tell anyone."),N("Wren wiped her face with her sleeve. Outside, the sun had begun to set, and for the first time in a hundred years, it did so on time.")];
var NOTE26=[N("Rosamund, wrapped in a quilt, handed Wren a folded slip of paper, a little crushed from three days in a dressing-gown pocket."),N("‘Wren — I'm sorry. I should have told you about the price. I thought if I told you, you'd stop, and the road would end. I was wrong to be afraid. You are far braver than I have ever been. The Midnight Ball is next. Twelve princesses, a palace of mirrors, a great many shoes. Wear comfortable ones. —H.’"),S_("Pocket","She always writes the last line first."),S_("Wren","She always knows where I'll be."),S_("Pocket","Then she's still ahead of us."),S_("Wren","Then let's catch up.")];
var PART26=[S_("Rosamund","Thank you. I'm going to sleep for about nine hours. Don't wake me unless there's a fire. Or a better fire."),S_("Prince Orlo","Rosamund! I've finished the apologies! There are two hundred and sixty-four letters!"),S_("Rosamund","Orlo. Not now. I'm unconscious."),N("Wren walked out of the castle, past a bridge where a giant man was happily fishing, past a baker handing out buns, past a cobbler whistling over a shoe. A green thread led on, over the hills, toward a faint, shimmering light."),S_("Pocket","The Midnight Ball. I can see it from here. It looks like a lot of glass."),S_("Wren","It looks like a lot of dancing."),S_("Pocket","Same thing. Glass dances, mostly.")];
