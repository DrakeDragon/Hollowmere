CH27.intro=[N("Hester's thread ran down out of the Thornwall hills, over a bridge, and into a country that glittered. Far ahead, the sky was lit from underneath, pink and gold, like a pie in an oven."),S_("Pocket","The Midnight Ball. I told you. It's all glass."),S_("Wren","I'm not sure I can dance."),S_("Pocket","Nobody can. That's why it goes on so long.")];
var HEELS_P=[N("The road was lined with shoes. Not worn ones: discarded. Hundreds of them, in drifts, in heaps, in neat, sad little rows. Dancing shoes. Dancing shoes with the soles worn right through."),N("A hand-painted board stood in a pile of laces. HEELSBY: SHOE REPAIR WHILE YOU WEEP.")];
var HEELS_R={HEALS:[N("HEELSBY: SHOE REPAIR WHILE YOU HEAL. A hush of relief runs along the road. Several shoes sit up a little straighter.")],HELPS:[N("HEELSBY HELPS. A shoe wanders over, nudges Wren's foot, and asks, hopefully, if she needs a hand.")],HELMETS:[N("HEELSBY: HELMETS. The shoes are suddenly very proud, and some of them are wearing hats.")]};
var ELLA_A=[N("In the middle of the shoe-heaps sat a girl on a three-legged stool, a hammer in one hand and a tiny glass slipper in the other. Her face was smudged with soot, her sleeves were rolled up, and her expression suggested that nobody was to ask her anything."),S_("Ella","Don't touch the slipper. It's cracked. They always crack. Who designs a shoe out of glass?"),S_("Wren","I... don't know."),S_("Ella","A man with a very small budget for comfort. I'm Ella. People call me Cinders. I've asked them to stop.")];
var ELLA_B=[S_("Ella","Every night I mend two hundred pairs of shoes. The ball starts at nine, and it never ends. Nobody leaves. It's always eleven fifty-nine."),S_("Pocket","Eleven fifty-nine?"),S_("Ella","The clock's stuck. So is my coach. So is my midnight. I was meant to be home by twelve. I've been 'about to leave' for a very long time."),S_("Wren","A woman in a green shawl. Sixty-eight. Went in two nights ago?"),S_("Ella","Brogues. Sensible ones. Went right in through the front gates and did not come out. They never come out.")];
var BOOT_P=[S_("Ella","Those boots won't last an hour in there. The floor's polished. It eats grip. Give them here."),N("She took Wren's boots, turned them over, and glared at them as if they had insulted her mother.")];
var BOOT_R={BOOKS:[N("The boots become two small books. Pocket reads the first aloud: 'How to Walk.' It's very short and quite good.")],BOOTHS:[N("Two small telephone booths, perfect and red. Ella puts one on each foot and clicks along the lane like a delighted horse.")],BOOGIES:[N("The boots begin to boogie. They hop in the air, click their heels, and make an impressive turn. Wren is carried several feet down the lane.")]};
var ELLA_C=[S_("Ella","Here. Slippers. Leather, rubber soles, no glass. I made them myself. Don't thank me, I'll be embarrassed."),S_("Wren","Thank you."),S_("Ella","I told you not to."),S_("Wren","They fit perfectly."),S_("Ella","...They would. I measured your boots.")];
var COACH_P=[N("A great orange coach sat across the road, wheels jammed in the mud. It was shaped like a pumpkin and smelled like a pie."),S_("Ella","That's mine. Was meant to turn back at midnight. Hasn't. It's been a pumpkin and a coach and a pumpkin and a coach, sort of, all at once, since Tuesday."),S_("Pocket","Wren. The word on the door.")];
var COACH_R={COUCH:[N("The coach flops over into a huge, soft couch. Ella sits on it, closes her eyes, and says nothing for eleven seconds.")],CROUCH:[N("The coach crouches, gathers itself, and trundles off to the side of the lane with enormous dignity.")],COACHMAN:[N("A coachman springs out of the door in a tall hat, tips it to Wren, and drives the whole thing into a ditch with great confidence.")]};
var HAIL27=[N("Beyond the coach, the road lifted over a hill, and there it was."),N("The palace stood on a lake of mirrors, every window ablaze, every tower hung with lanterns. Music poured out of it, thin and bright and perfectly in time. And it was a little, a very little, too perfect."),S_("Ella","That's it. That's the Ball."),S_("Wren","Why does it sound so... stopped?"),S_("Ella","Because it is.")];
CH28.intro=[N("The queue to the Midnight Ball wound back from the palace gates and out across the lake, three people wide and five miles long. Nobody in it moved."),S_("Ella","They've been standing here since Sunday. They're not allowed to leave in case they lose their place."),S_("Pocket","That's the stupidest thing I've ever heard."),S_("Ella","That's the Palace.")];
var QUEUE_A=[N("The guests were gorgeous, motionless and bored. One duchess was fast asleep standing up. A count was reading the same newspaper he had read for three days. A very young prince had given up and was building a sandcastle from sugar."),S_("Count","Excuse me, is it Monday?"),S_("Ella","It's Thursday."),S_("Count","Oh. Thank you. I'd mislaid a week.")];
var POMFREY_A=[N("At the gates stood a stately man in a powdered wig and a velvet coat, holding a scroll as long as a bedsheet. Every few seconds he cleared his throat."),S_("Lord Pomfrey","Lord Pomfrey, Grand Chamberlain. All guests must be ANNOUNCED. No announcement, no entry. No entry, no ball. No ball, no purpose. I'm a man of purpose."),S_("Pocket","Wren. Don't give him your name."),S_("Wren","What do I give him?"),S_("Ella","Give him a crate.")];
var CRATE_P=[N("Ella dragged a wooden crate from behind the shoe stall. SHOES FOR THE BALL, it said, stencilled in neat black paint. A word glowed on the lid."),S_("Ella","Get in. He doesn't check crates. He's never checked a crate. Crates are beneath him."),S_("Wren","I'm not sure I fit."),S_("Ella","The word will help.")];
var CRATE_R={CREATE:[N("CREATE. The crate throws open its lid and an enormous, eager imagination drifts out. There's plenty of room inside for Wren, and for a small orchestra.")],CRATER:[N("The crate becomes a crater. Wren walks into it. It is comfortable and very deep, with a small door at the bottom.")],CRAFTY:[N("The crate becomes crafty. It folds Wren inside, shuts its lid, and winks, as if sharing a secret that hasn't happened yet.")]};
var POMFREY_B=[N("The crate was lifted by two very bored footmen and set down in front of Lord Pomfrey."),S_("Lord Pomfrey","Contents?"),S_("Ella","Shoes. Mine. For the ball."),S_("Lord Pomfrey","And the delivery girl's name?"),S_("Ella","Ella."),S_("Lord Pomfrey","...The cinder-girl. Of course. I know you. And the crate's name?"),S_("Wren","(from inside) Marjorie."),S_("Lord Pomfrey","Marjorie! How splendid! The forest has been talking about you for days. ANNOUNCING: THE CRATE OF MARJORIE!"),S_("Pocket","I'm so proud and so alarmed.")];
CH29.intro=[N("The Hall of Mirrors ran the length of the palace, a corridor of silver glass and golden frames, with chandeliers like frozen fireworks. In every mirror, a thousand Wrens walked beside her."),S_("Pocket","This is... a lot of me."),S_("Wren","You look worried in all of them."),S_("Pocket","That's the one thing they've got right.")];
var MIRROR_A=[N("Ella checked her reflection, frowned at her sooty face, and wiped her cheek with a thumb. In the mirror, her reflection frowned right back. Then it winked. Ella had not."),S_("Ella","They do that. Don't look at them for too long. They start to have opinions.")];
var VANITY_P=[N("A great gilt table stood in a corner, stacked with powder, perfume and tiny silver hairbrushes. A word was engraved on the mirror above it.")];
var VANITY_R={VANILLA:[N("The vanity fills with the warm smell of vanilla. Several guests, long motionless, begin to smile.")],VANISH:[N("The vanity vanishes. So does every smudge, mirror-stain and thumbprint in the Hall. It sparkles. It is faintly alarming.")],VANITIES:[N("A dozen small vanities appear, each doing a different job. One powders. One perfumes. One sulks.")]};
var REFLECT=[N("Wren stopped. In every mirror in the Hall, her reflection had stopped too. But not like a girl."),N("It was a page. A single sheet of thick, cream paper, upright, with a torn, ragged edge down one side, and a line of faded ink that drifted across it like breath on glass."),S_("Pocket","...Wren."),S_("Wren","That's not me."),S_("Pocket","It is. It's what you are in the book. Look at the edge. It's been torn out of something."),S_("Ella","You're a... page?"),S_("Wren","I'm a girl. I've got a grandmother. I've got a favourite kind of toast. I had a favourite kind of toast."),S_("Pocket","Wren. You can be both.")];
var MIRROR_P=[N("At the end of the hall, a tall silver mirror blocked the corridor entirely, polished and enormous. In its frame, a word glowed."),S_("Ella","That's the Final Mirror. The ballroom's behind it. It's never opened. It doesn't want to. It likes itself too much.")];
var MIRROR_R={MIRTH:[N("The mirror giggles. It giggles so hard it falls off its own frame, and the doors behind it swing open.")],MIRACLE:[N("The mirror gives a gasp, goes misty, and becomes a doorway of pure light. Several chandeliers applaud.")],MARROW:[N("The mirror becomes a mirror of marrow, rich and savoury. A faint smell of Marrow's bakery drifts through the hall. Wren holds on to it for a moment.")]};
CH30.intro=[N("The ballroom doors opened onto a floor of gold and cream checkerboard, a hundred yards across, and a thousand dancers turning on it in perfect time."),N("The music was beautiful. The music was also the same eight bars it had been all night."),S_("Pocket","Don't listen. If you listen, you'll tap your foot. If you tap your foot, you'll stay."),S_("Wren","I'm not tapping."),S_("Pocket","You tapped.")];
var PRINCESSES_A=[N("Along one wall, in a long and weary line, twelve young women in twelve pale gowns were dancing without stopping, in time, in step, and without joy. Their shoes had holes in them. Their faces were exhausted."),S_("Princess Ottoline","Welcome, visitor. We are the Twelve Dancing Princesses. I am Ottoline, the eldest. These are my sisters. We cannot stop."),S_("Princess Pippa","I'm Pippa. The youngest. We've tried everything. We've tried falling over. The dress holds us up.")];
var PRINCESSES_B=[S_("Princess Ottoline","The story says we sneak out each night through a secret door to dance. It says our shoes wear out, and the king can't work out why."),S_("Princess Pippa","It never says we're tired. It never says we'd rather have a cocoa."),S_("Princess Ottoline","There was a soldier. He solved the riddle. He followed us. We were meant to stop, and go home, and be happy."),S_("Princess Pippa","Then the clock stuck. And now it's midnight forever, which is also never."),S_("Wren","Has a woman in a green shawl come through?"),S_("Princess Ottoline","Hester? She danced with us for an hour. She is the only person who made us laugh. Then she walked to the centre of the floor. And stopped.")];
var SHOE_P=[N("Pippa's slipper had a hole as big as a plum. A word was stitched on the sole.")];
var SHOE_R={SOLD:[N("The shoe is SOLD. A tiny shop appears, a polite stranger buys it for twelve coins, and Pippa is mortified, then delighted, then rich.")],SOUL:[N("The word becomes SOUL. The shoe lights up, hums, and Pippa catches her breath. For one breath her whole face is hers again.")],SOLO:[N("The word becomes SOLO. Pippa spins out of the line, executes a single glorious leap, and comes down laughing.")]};
var DANCING_P=[N("The princesses spun back into formation, blocking the way to the middle of the floor. They moved like a gate that couldn't open."),S_("Princess Ottoline","I'm sorry. We can't step aside. The dance won't let us."),S_("Pocket","Wren. The word. Over their heads.")];
var DANCING_R={DAWNING:[N("DAWNING. A soft grey light creeps in at the windows. The princesses look up, as though remembering mornings, and drift to the sides in a long line.")],DANDY:[N("DANDY. The twelve of them suddenly feel splendid. They bow, take each other's arms, and promenade off in a row, laughing.")],DINING:[N("DINING. A long white table appears. Twelve gold chairs. The princesses sit, all at once, and have the best supper of their lives.")]};
CH31.intro=[N("Wren walked out onto the great checkerboard floor. The dancers turned around her, graceful, unseeing, a slow, perfect carousel of silk."),N("From the shadows at the edge of the room, something grey and soft and very, very thin began to flow across the floor, as quiet as a spilled secret."),S_("Pocket","That's a Hush-Smudge. It's following the music. It's looking for the part that doesn't fit."),S_("Wren","Which is me."),S_("Pocket","Which is you. RUN!")];
var CHAND_R={CHANDLER:[N("The chandelier becomes a chandler. A very small man with a very large basket of candles drops from the ceiling, apologises, and starts selling them to the Smudge.")],CHAUFFEUR:[N("The chandelier becomes a chauffeur, in a peaked cap, who opens the door of a very long car. The Smudge climbs in and is driven away.")],CHAMPAGNE:[N("The chandelier becomes champagne. It rains in a sparkling, fizzy shower. The Smudge sneezes and slows to a bubbly crawl.")]};
var WALTZ_R={WALTS:[N("Every dancer is suddenly called Walt. They all turn round at once, look at one another, and begin an awkward introduction.")],WALNUT:[N("The waltz becomes a walnut. It rolls across the floor, and the Smudge chases it, delighted.")],WALRUS:[N("The waltz becomes a walrus. It dances beautifully, and nobody can understand how.")]};
var ORCH_R={ORCHARD:[N("The orchestra becomes an orchard. Apples drop, the Smudge slips, and a violin full of blossoms plays a very sleepy tune.")],ORCHID:[N("The orchestra becomes an orchid. It sways in a draught, and the Smudge is held, utterly entranced.")],OSTRICH:[N("The orchestra becomes an ostrich. It looks at the Smudge, looks at the audience, and runs for it. The Smudge, offended, follows.")]};
var DOORWAY=[N("An enormous oak door stood open at the far end of the floor. Beyond it, spiralling up, was a stone stair that led into the heart of the palace."),S_("Ella","The clock tower. It's the only way up. The Smudge can't climb stairs. I think."),S_("Pocket","You think?"),S_("Ella","Nobody's ever tried.")];
CH32.intro=[N("The clock tower stair coiled upward through the palace like the inside of a shell. Behind them, the music faded, and the quiet that replaced it was enormous."),S_("Ella","I've never been up here. Nobody has. The key's been on my chain for years."),S_("Pocket","What key?"),S_("Ella","I was given it by my godmother. She said, 'Keep it safe. You'll know when.' I thought it was a bottle opener.")];
var STAIR_A=[N("Halfway up, a tall window gave a view over the whole ballroom. The dancers were tiny from here, a ring of colour turning very slowly, like a music box."),S_("Wren","They look so happy from this high."),S_("Ella","They look happy from everywhere. That's the problem. Nobody's asked them.")];
var CLOCK_P=[N("At the top of the stair the clock stood, a great brass face as wide as a barn. Its hands were stuck at one minute to twelve. Beneath it, on a small brass plaque, was a word."),S_("Ella","ALMOST. That's what it says. 'Almost midnight.'"),S_("Pocket","The word, Wren. And Ella. The key.")];
var CLOCK_R={"AT LAST":[N("AT LAST. The clock sighs, drops its weight on the last second, and every bell in the palace begins to ring.")],ALMANAC:[N("ALMANAC. The clock recites the date, the tides and the best time to plant parsnips, then chimes twelve, and is embarrassed.")],ALMOND:[N("ALMOND. A single almond rolls out of the clock face and drops into Ella's hand. Then the clock strikes, quietly, as if it had never done so before.")]};
var STRIKE=[N("Twelve strokes. The bells rang through the palace, through the ballroom, through the whole lit lake, and everything that had been held tight let go."),N("Down in the ballroom, a thousand dancers stopped at once. A thousand pairs of shoes fell off. The music ended on a note that had been waiting a very long time to finish."),S_("Ella","It's midnight."),S_("Pocket","It's midnight. It's actually midnight."),S_("Ella","My coach will turn back. I'll finally go home. I'm going to take such a long bath."),N("Ella laughed, short and amazed, like someone who had forgotten they had a laugh.")];
var KEY_ELLA=[S_("Ella","Wren. Wait. The key. It's not a bottle opener. Look."),N("She held it up. Etched along its shaft, in tiny letters, were the words: THE LAST ROOM."),S_("Pocket","The Last Room?"),S_("Ella","Under the ballroom. Where they keep the people the dance forgets.")];
CH33.intro=[N("The ballroom was silent. The dancers stood barefoot among their fallen shoes, blinking, confused and weeping and laughing all at once."),N("And from the far end of the floor, through the crowd, one figure walked toward Wren, unhurried, unbothered, like a man crossing a room to ask for the time.")];
var ALARIC_A=[N("He was tall, thin and elegantly tired, in a long grey coat the colour of rain. His hair was silver at the temples. His hands were stained with ink. Behind one ear, balanced like a pen, was a slender blue pencil."),S_("Alaric","Good evening. You must be the girl who stopped the clock."),S_("Alaric","I'm so sorry to intrude. Would you do me the honour of a dance?")];
var ALARIC_B=[S_("Pocket","Wren. Don't."),S_("Wren","Who are you?"),S_("Alaric","Forgive me. I should have said. I'm Alaric Vael. A reader, mostly. A mender. I look after the endings."),S_("Wren","The Redactor."),S_("Alaric","That's what they call me. It's an ugly word. I prefer 'editor.' May I know your name?")];
var NAME_R={MARJORIE:[N("‘Marjorie,’ said Wren, as steadily as she could."),N("Alaric smiled, and the smile was gentle, and for a moment it didn't match the coat. ‘A tree told me,’ he said. ‘It was extremely excited.’")],NOBODY:[N("‘Nobody,’ said Wren."),N("‘That's not a name,’ said Alaric, kindly. ‘It's a description. I find people usually do it when they're afraid.’")],PRIVATE:[N("‘That's private,’ said Wren."),N("‘Of course,’ said Alaric. ‘Though I'd say a great many things about you are less private than you'd like.’")]};
var ALARIC_C=[S_("Alaric","I know who you are, you know. I'd know you in the dark. You have my sister's chin."),S_("Wren","I don't have a sister."),S_("Alaric","No. But I do. Or I did. Or I do. It's all a matter of tense."),N("He offered his hand. It was warm, ink-stained, and very steady. Wren did not take it."),S_("Alaric","No. Quite right. Another time.")];
CH34.intro=[N("The crowd parted for Alaric as it would have for a bishop. He walked at Wren's side, gently, across the checkerboard, saying nothing. Wren walked beside him, saying nothing at all.")];
var WALK_A=[S_("Alaric","The thing about an ending is that it's never kind. People think it will be. It's only ever final."),S_("Alaric","I've spent forty years trying to find one that isn't cruel. And I find that the kindest thing one can do, with a cruel ending, is not to have written it."),S_("Wren","You erase them."),S_("Alaric","I spare them."),S_("Pocket","That's not the same word."),S_("Alaric","It's the same pencil.")];
var CENTRE=[N("In the very centre of the floor, in a circle of cyan frost, a woman stood on one foot, her head thrown back, her mouth wide open. She wore a green shawl. In one hand she held a thread."),S_("Wren","Grandmother."),N("She was frozen mid-laugh. Her eyes were closed. Her hands were up. She was mid-turn, light on her feet, as if she'd been the happiest person in the room."),S_("Wren","She's laughing. She's laughing and I can't hear it."),S_("Pocket","Wren."),S_("Wren","I can't hear it. I can't hear her.")];
var TOUCH=[N("Wren put a hand on her grandmother's cheek. It was cold as glass. A thin cyan frost crept across her fingers, gently, politely, like a question."),S_("Pocket","Don't! The Hush!"),N("Wren pulled her hand away. The thread in Hester's fingers trembled, and the end of it fell loose, drifting like a leaf, and settled in Wren's palm."),S_("Pocket","She gave you the end of it. She let go on purpose.")];
var ALARIC_D=[S_("Alaric","I did not freeze her. I want that understood. She came in two nights ago, and asked me to dance, and I said yes."),S_("Alaric","She laughed. She hasn't laughed in forty years. I couldn't stand to hear it. I looked away. And when I looked back, the Hush had her. She was so happy, Wren. She was in the best moment of her life, and it took her."),S_("Wren","You let it."),S_("Alaric","I let it. I've never stopped being sorry.")];
CH35.intro=[N("The ballroom emptied around them, slowly, as the guests went to find their shoes. Soon there was only the great gold floor, the pool of frost, the frozen woman, and three small figures in the centre."),S_("Ella","I think I'll stand over there. By the door. Very much by the door.")];
var OFFER_A=[S_("Alaric","I can thaw her. I want you to know that. I can undo the Hush with one stroke of this."),N("He took the blue pencil from behind his ear. It glinted, thin and bright, like a very small sword."),S_("Alaric","And all I need in return is yours. The pen. The one that changes words. Give it to me, and I'll finish the story gently, and nobody else will ever pay for an ending again."),S_("Wren","The ledger. The Erasure. You made it."),S_("Alaric","I didn't make it. I merely noticed it. I'd like to stop it. You see, I know what it costs, because I've paid it. I've paid nineteen thousand times.")];
var OFFER_B=[S_("Pocket","Don't. Whatever you do. It's a trap, and the trap is polite."),S_("Alaric","It's not a trap. It's a kindness. It's the only one I've ever been able to offer."),S_("Wren","If I give you the pen, what happens to the road?"),S_("Alaric","It ends. Gently. Everyone is spared."),S_("Wren","What happens to me?"),S_("Alaric","You'd be returned to the book. To the page you came from. It would be very quiet. You would feel almost nothing."),S_("Wren","That's not a kindness."),S_("Alaric","It's the only kind there is.")];
var YES_P=[S_("Alaric","Well? Will you?")];
var YES_R={NO:[N("‘No,’ said Wren.")],"NOT YET":[N("‘Not yet,’ said Wren.")],MAYBE:[N("‘Maybe,’ said Wren."),N("Alaric looked at her for a long moment. ‘Maybe,’ he said softly. ‘That's the most honest answer I've had in forty years.’")]};
var ALARIC_E=[S_("Alaric","Then I'll wait. I'm very good at waiting. But Wren. The Hush is faster than I am. It's in the road, the ground, the mirrors. It's going to reach everything. When it does, you'll want a kinder pencil than the one you have."),S_("Wren","I'll find another way."),S_("Alaric","I hope so. I do. I truly do."),N("And he hummed, once, very softly, half a bar of something. A lullaby, with its first note missing. And then he stopped, as though he'd said something indecent, and walked away across the floor with his hands clasped behind him."),S_("Pocket","That was the tune."),S_("Wren","I know."),S_("Pocket","He knows it. He knows it, Wren.")];
CH36.intro=[N("A wind had come up. It blew in through the broken windows, scented with lightning and something that tasted faintly of corn."),S_("Ella","That's no ordinary wind."),S_("Pocket","It's a draught from the next book. I can smell it. Something yellow."),S_("Wren","Hester left a note.")];
var NOTE36=[N("In her frozen fingers, under the shawl, Hester had tucked a folded slip of paper. It came away at a touch, like a leaf."),N("‘Wren — if you're reading this, I've been caught. Don't weep. Not because you mustn't. Because I'd rather you laughed. Alaric was my brother. I'm so sorry you had to find that out here. He isn't a monster. He's worse. He's right about almost everything. Follow the yellow. There's a girl in Kansas who will need you. —H.’"),S_("Pocket","Her brother."),S_("Wren","I know. I think I knew. I think I've always known there was someone missing."),S_("Pocket","Kansas?"),S_("Wren","Wherever that is. I think it's wherever the wind's going.")];
var ELLA36=[S_("Ella","Wren. I'll stay. With her. I'll keep her warm and dusted and wound up. I'm the best person for the job. I'm the only person here who never wanted a happy ending. I only wanted to go home."),S_("Wren","Ella..."),S_("Ella","I'll keep the clock ticking. Somebody should. And when you come back, I'll have the kettle on. And the slippers. Don't forget the slippers."),N("She pushed a brown-paper parcel into Wren's arms. Inside, a second pair of slippers, in a smaller size.")];
var PRINCESS36=[S_("Princess Pippa","Thank you! We're going to bed! Ottoline's going to sleep for a week!"),S_("Princess Ottoline","I'm going to sleep for a fortnight."),S_("Pippa","We'll leave a light on. In case you're out in the dark."),N("Twelve princesses, barefoot, waved from the window. Behind them, the great ballroom was already filling with sleepers, in chairs, on sofas, among the fallen shoes.")];
var STORM=[N("The wind grew, and grew, and the palace windows rattled in their frames. Out over the lake of mirrors, the sky had turned the colour of a bruise, and a thin grey funnel was winding down out of it, turning, turning."),S_("Pocket","It's not a storm."),S_("Wren","What is it?"),S_("Pocket","It's pages. Look. It's all pages."),N("It was. A whirling spiral of pages, thousands of them, flapping and turning and shining in the lantern light, coming down across the lake toward the palace like a very large, very patient question.")];
var LAST36=[S_("Wren","Pocket. Hold on."),S_("Pocket","I'm holding. I'm holding. I'm holding."),S_("Ella","Wren!"),S_("Wren","Yes?"),S_("Ella","Comfortable shoes!"),N("Wren laughed. It was the first time since the Thornwall. It was a small laugh. It did not sound like spoons. But it was hers."),N("The wind took her off her feet. The pages closed round her. The palace shrank to a gold coin, and then to a spark, and then to nothing, and the thread in her hand pulled taut, and went on, and on, and on.")];

function showTitle(){G.started=false;G.ch=null;$("hud").style.display="none";$("edit").style.display="none";$("dlg").style.display="none";closePicker();
 var s=load();$("bCont").style.display=(s.mid&&s.ch&&s.bi>1)?"inline-block":"none";
 var box=$("chsel");box.innerHTML="";box.style.cssText="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:300px;margin-top:8px";if((s.max||1)>=2){var lb=document.createElement("div");lb.style.cssText="width:100%;font-size:12px;opacity:.7;letter-spacing:2px;text-transform:uppercase";lb.textContent="Jump to chapter";box.appendChild(lb);}
 for(var k=2;CHS[k]&&k<=(s.max||1);k++){(function(n){var b=document.createElement("button");b.className="btn alt";b.style.cssText="min-width:44px;min-height:44px;padding:6px 8px;font-size:14px;margin:0";b.textContent=n;b.addEventListener("click",function(){startChapter(n);});box.appendChild(b);})(k);}
 $("title").style.display="flex";}
function resetState(){G.f={};G.items=[];G.sm=null;G.fen=null;G.comp=null;G.bi=0;G.fails=0;G.ink=3;G.dlg=null;G.picker=null;G.card=null;G.joy=null;G.stingOn=false;$("dlg").style.display="none";closePicker();}
function enter(){$("title").style.display="none";$("hud").style.display="block";drawInk();G.started=true;}
function startChapter(n){var ch=CHS[n];G.ch=ch;G.chn=n;resetState();G.pkOn=n>2;G.p={x:ch.cx(ch.startY),y:ch.startY};G.pk={x:G.p.x,y:G.p.y+16};if(ch.setup)ch.setup();setObj("");enter();
 showCard(ch.kicker+" \u00b7 Chapter "+n,ch.title,ch.cardBody,function(){G.bi=1;say(ch.intro,function(){setObj(ch.obj0);if(ch.afterIntro)ch.afterIntro();save({bi:1,y:ch.startY,f:{}});});});}
function begin(){startChapter(1);}
function cont(){var s=load();if(!s.ch||!CHS[s.ch])return begin();var ch=CHS[s.ch];G.ch=ch;G.chn=s.ch;resetState();G.f=s.f||{};G.bi=s.bi;G.p={x:ch.cx(s.y),y:s.y};G.fails=s.fails||0;G.pkOn=G.chn>2||!!G.f.pocket;G.pk={x:G.p.x,y:G.p.y+16};
 if(G.chn===3&&G.f.bridge)G.sm={type:"smudge",x:0,y:1110,st:"trapped"};
 if(ch.setup)ch.setup();
 if(G.chn===5&&G.bi>=2)G.fen={x:G.p.x+50,y:G.p.y-60,mode:"door",t:0};
 if(G.chn===6&&G.bi>=2&&G.bi<=4){G.fen={x:ch.cx(G.p.y-110)+40,y:G.p.y-110,mode:"run",ty:1800,t:0};startChase("red",G.p.y+260,64,"Run north! Edit things to slow Red down");}
 if(ch.afterIntro&&G.bi<=1&&!(G.chn===2&&G.f.pocket))ch.afterIntro();
 setObj(ch.obj0);enter();}
$("erase").addEventListener("click",function(){if(confirm("Erase all saved progress and start over?")){try{localStorage.removeItem(SAVE);}catch(e){}showTitle();}});$("bBegin").addEventListener("click",begin);$("bCont").addEventListener("click",cont);

var settingsPanel=$("settingsPanel"),prefs={size:"21",motion:"instant",walk:"drag",art:"on"};
try{Object.assign(prefs,JSON.parse(localStorage.getItem("hollowmere_comfort")||"{}"));}catch(e){}
function applyPrefs(){
 document.documentElement.style.setProperty("--reading-size",prefs.size+"px");
 try{localStorage.setItem("hollowmere_comfort",JSON.stringify(prefs));}catch(e){}
 if(G.dlg)syncReading();if(G.card)syncChapterArt($("ct").textContent);
}

var artDescriptions={
"hesters-kitchen":"Hester's empty chair, cold tea and open book in her morning kitchen.",
"pocket-briars":"Wren finds Pocket the inkwell tangled in twilight briars.",
"stitch-bridge":"Wren and Pocket at the woodland bridge.",
"green-thread":"Wren and Pocket follow Hester's green thread into Bramblewood.",
"wolf-library":"Fennimore Wolf at the doorway of his hollow oak library.",
"red-door":"Red and Fennimore share a peaceful moment by the red-doored cottage.",
"sweet-road":"Wren and Pocket enter a gumdrop woodland along the toffee-colored Sweet Road.",
"secret-market":"Gretel records a sale among glowing jars at the Secret Market.",
"grimsby-house":"Grimsby shoos birds from her gingerbread bed-and-breakfast as Wren arrives.",
"reach-panorama":"A towering beanstalk leads from farmland to a castle among the clouds.",
"thorn-panorama":"A sleeping kingdom behind enchanted roses and thorns.",
"ball-panorama":"The mirrored halls and golden lights of the Midnight Ball."
};
function storyScene(pages){
 var key="";
 if(pages===CH1.intro)key="hesters-kitchen";
 else if(pages===CH2.intro||pages===BRIAR_P||pages===POCKET2||pages===POCKET_P)key="pocket-briars";
 else if(pages===CH3.intro||pages===CHASE3)key="stitch-bridge";
 else if(pages===CH4.intro||pages===ALDER||pages===KNOT||pages===RULES||pages===END3)key="green-thread";
 else if(pages===LIB_A||pages===LIB_B||pages===INSIDE||pages===TUESDAY||pages===LOOP1||pages===BOOKMARK)key="wolf-library";
 else if(pages===CH8.intro)key="red-door";
 else if(pages===CH9.intro||pages===GROVE||pages===LICK_P)key="sweet-road";
 else if(pages===CH10.intro||pages===GRETEL_A||pages===JARS||pages===GRETEL_B||pages===GRETEL_C||pages===GRETEL_D||pages===RECEIPT)key="secret-market";
 else if(pages===CH11.intro||pages===GRIM_A||pages===GRIM_B||pages===EDIBLE_P||pages===DOOR_P)key="grimsby-house";
 if(!key&&G.ch)key=regionArt(G.chn);return key?[key,artDescriptions[key]||"An illustrated view of this part of Wren’s journey."]:null;
}
function syncChapterArt(title){
 var map={"The Last Page":"hesters-kitchen","The Inkpot in the Briars":"pocket-briars","The Stitch Bridge":"stitch-bridge","The Green Thread":"green-thread","The Lending Library":"wolf-library","Rope and Whiskers":"red-door","Crumbs":"sweet-road","The Secret Market":"secret-market","Grimsby's House":"grimsby-house"};
 var key=map[title];if(!key){for(var n=1;n<=36;n++)if(CHS[n]&&CHS[n].title===title){key=regionArt(n);break;}}var img=$("chapterArt");
 img.hidden=!key||(typeof prefs!=="undefined"&&prefs.art==="off");
 if(key){img.src="assets/"+key+".webp";img.alt=artDescriptions[key]||"An illustrated view of this chapter’s setting.";}
}

function syncReading(){
 var d=G.dlg;if(!d)return;
 var scene=storyScene(d.pages),file=scene?scene[0]:"",alt=scene?scene[1]:"";
 var img=$("storyArt");img.hidden=!file||prefs.art==="off";if(file){img.src="assets/"+file+".webp";img.alt=alt;}
 $("readingProgress").textContent="Passage "+(d.i+1)+" of "+d.pages.length;
 $("prevPage").disabled=d.i===0;
 $("nextPage").textContent=d.i===d.pages.length-1?"Continue the journey →":"Next passage →";
 if(prefs.motion==="instant"){d.pos=d.pages[d.i].t.length;$("dtext").textContent=d.pages[d.i].t;}
 $("dlg").scrollTop=0;
}
$("prevPage").onclick=function(e){e.stopPropagation();if(G.dlg&&G.dlg.i>0){G.dlg.i--;showPage();}};
$("nextPage").onclick=function(e){e.stopPropagation();advance();};
$("dlg").addEventListener("pointerdown",function(e){e.stopPropagation();});
$("settingsOpen").onclick=function(){G.joy=null;G.destination=null;settingsPanel.hidden=false;};
$("settingsClose").onclick=function(){settingsPanel.hidden=true;};
[["textSize","size"],["textMotion","motion"],["walkMode","walk"],["artMode","art"]].forEach(function(pair){$(pair[0]).value=prefs[pair[1]];$(pair[0]).onchange=function(){prefs[pair[1]]=this.value;applyPrefs();};});
["storyArt","chapterArt"].forEach(function(id){$(id).onerror=function(){this.hidden=true;};});
applyPrefs();


function drawBees(x,y){
 c.save();for(var i=0;i<3;i++){var a=G.t*3+i*2,bx=x+Math.cos(a)*22,by=y-44+Math.sin(a*1.3)*13;
 c.fillStyle="#f2d68b";c.beginPath();c.ellipse(bx,by,2.8,1.7,a,0,7);c.fill();
 c.fillStyle="rgba(255,247,218,.7)";c.beginPath();c.ellipse(bx,by-2,2,1.5,-a,0,7);c.fill();}c.restore();
}
function materialPass(fn,shadow){
 return function(){
 c.save();c.shadowColor=shadow||"rgba(9,30,28,.26)";c.shadowBlur=2;c.shadowOffsetY=1.3;
 try{return fn.apply(null,arguments);}finally{c.restore();}
 };
}
sign=materialPass(sign);
mossback=materialPass(mossback);
hive=materialPass(hive);
campfire=materialPass(campfire,"rgba(255,197,102,.4)");
cane=materialPass(cane);
bigdoor=materialPass(bigdoor);
shelves=materialPass(shelves);
pillars=materialPass(pillars);

var last=0;function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(loop);}
showTitle();requestAnimationFrame(loop);
})();
</script></body></html>
